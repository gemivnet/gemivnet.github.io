  link_text: "license"

# ── /changelog ──────────────────────────────────────────────
# Entries are pulled from git log at build time — no manual list to maintain.
changelog:
  title: "changelog"
  intro: "Commits to this site, newest first. Versions auto-increment per push. Co-authored with claude."
