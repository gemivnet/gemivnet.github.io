# Build tunables for scripts/build.mjs.
# Numbers that used to be scattered through the script as literals. Change them
# here; the build reads this file at startup and nothing else hardcodes them.

# Where post sections come from and how their index renders.
# root = content/<root>/ and the URL base. timeline = one dated stream on the
# index instead of cards grouped by folder.
sections:
  musings:
    root: musings
    base: /musings
    active: musings
    timeline: false
  rv12is:
    root: rv12is
    base: /rv12is
    active: rv12is
    timeline: true

# Folder names that would collide with generated routes under /foia.
# A request slug matching one of these fails the build.
foia_reserved_routes: [agency, tag, tags, index]

text:
  words_per_minute: 220      # reading-time estimate
  preview_chars: 220         # index excerpt length
  seo_description_chars: 158 # fallback <meta description> when seo.description is absent
  foia_blurb_chars: 180      # fallback request blurb from the summary's first line

images:
  # Gallery derivatives written next to the original.
  gallery_med:   { width: 1400, quality: 82 }
  gallery_thumb: { width: 600,  quality: 78 }
  # Square crop shown beside each row in the shared entry list.
  # position: attention picks the crop by entropy so it lands on the subject.
  entry_thumb:   { width: 160, height: 160, quality: 76, position: attention }
  # Local post images (the build log keeps its photos in the repo) get these
  # smaller copies baked at build, offered by srcset with `sizes` so a phone
  # takes 800 and a wide screen 1400. 32px is the phone gutter, twice 16.
  post_widths:
    widths: [800, 1400]
    quality: 80
    sizes_full: "(max-width: 639px) calc(100vw - 32px), 680px"
    sizes_inline: "(max-width: 639px) calc(100vw - 32px), 300px"

# Link-preview cards (og:image) for pages without a photo of their own:
# FOIA, recipes, section indexes, posts with no featured image. Long titles
# and sub-lines are cut at a word to these lengths.
cards:
  width: 1200
  height: 630
  margin: 80
  title_chars: 70
  sub_chars: 90

# The left rail (templates/_rail.eta). A post with at least toc_min_headings
# h2s lists them under "on this page"; index rails show the top_tags commonest
# tags with a link to the rest.
rail:
  toc_min_headings: 3
  top_tags: 12

# Home page. "Lately" lists this many of the newest musings, build-log entries
# and records requests together.
home:
  lately_count: 8

limits:
  rss_items: 30       # entries in rss.xml / atom.xml
  tag_keywords: 10    # <meta keywords> on a tag page

# Recipe cards. `npm run recipes:import` reads the Typst cards from <source>/src
# (path relative to this repo) and writes content/recipes/<slug>/.
recipes:
  source: ../recipes

# Site search (/search). Each entry's searchable text is capped at body_chars;
# snippet_chars is the line shown under a result.
search:
  body_chars: 4000
  snippet_chars: 160
  max_results: 50

# Google Analytics. tag_id is the Google tag Google gave for the site (it loads
# the GA4 stream below); ga4_id is that stream's measurement id, used for the
# opt-out's ga-disable flag. tag_id null = no tag at all. The tag only loads
# on the live host, so `npm run dev` never counts.
analytics:
  tag_id: GTM-P8NDMP97
  ga4_id: G-9KD99X1TP2

# Recipe SEO. The heaviest ingredients by weight become keywords, minus the
# ones every recipe has. A credit starting with one of anonymous_sources isn't
# named in the meta description ("adapted from Printout" says nothing).
recipes_seo:
  keyword_ingredients: 4
  keyword_skip: [water, salt, table salt, kosher salt, sugar, ice, oil, pan spray]
  anonymous_sources: [printout, handwritten, typed]
