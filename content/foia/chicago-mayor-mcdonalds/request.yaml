    title: Request submitted to the Office of the Mayor
    note: >-
      Filed through the Chicago Public Records portal for every email sent or received by Mayor
      Brandon Johnson since May 15, 2023, the start of his term, referencing the McDonald's
      restaurant chain or McDonald's Corporation. The request listed the terms to search, being
      "McDonald's", "McDonalds", "Mc Donalds", "MCD" and "Golden Arches", and asked that emails
      mentioning people with the surname McDonald be excluded unless they also referenced the chain.
