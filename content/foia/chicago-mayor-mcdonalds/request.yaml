  - id: 2026-10-19-release
    date: "2026-10-19"
    type: partial
    title: Partial release, 1,084 pages
    exemptions:
      - 7(1)(b)
      - 7(1)(c)
      - 7(1)(d)(v)
      - 7(1)(d)(vi)
      - 7(1)(v)
    note: >-
      Released with redactions under five sections of the Act. Section 7(1)(b) covers private
      information, applied to personal cell numbers, home addresses and personal email addresses.
      Section 7(1)(c) covers personal information whose release would be an unwarranted invasion of
      privacy, applied to personal events and third-party names. Sections 7(1)(d)(vi) and 7(1)(d)(v)
      cover danger to life or physical safety and specialised investigative techniques, applied to
      the names of officers assigned to the mayor's detail. Section 7(1)(v) covers security
      measures, applied to information about the detail's members. The letter sets out review rights
      before the Public Access Counselor.
