summary:
  text: |
    One release, two documents, 1,084 pages, covering May 2023 to October 2026.
    The emails account for 1,081 of those pages, and 59 of them contain one of
    the requested terms.

    The volume is almost entirely the Mayor's Press Office daily news clips
    digest, 18 editions between August 5 and November 15, 2024, in which the
    chain appears inside press coverage rather than in correspondence. The
    remainder is subscription newsletters that mention it in passing, including
    The Daily Line, The Well News and Axios, and constituent letters to the
    mayor on unrelated subjects whose quoted threads carry one of the terms.
    One message is addressed to the chain's chief executive at his corporate
    address.

    Other correspondents on the released pages include members of the City
    Council, Chicago Police district CAPS mailboxes, the Illinois governor's
    office, and federal offices at the Department of Justice, DEA, ATF and
    Homeland Security.

    Redactions are applied throughout under five sections of the Act. Personal
    contact details, third-party names and personal events are blacked out, as
    are the names of officers assigned to the mayor's security detail.
