    type: filed
    track: council
    tracking: D126583-013026
    title: Follow-on request to the City Council committee
    note: >-
      Filed the same day CDOT responded, directed at the Committee on Pedestrian and Traffic Safety,
      for all records on ordinance Or2024-0013710, correspondence, testimony, staff reports and any
      documentation submitted to or generated by the committee.
  - id: 2026-02-05-council-response
    date: "2026-02-05"
    type: no-records
    track: council
    title: Committee holds no additional records
    note: >-
      The Secretary to the Council responded that the Committee holds nothing beyond what the Office
      of the City Clerk already publishes as the official repository for City Council documents, and
      pointed to the order and the April 8, 2025 committee meeting materials in the eLMS system. The
      response invoked 5 ILCS 140/8.5, under which availability on the Clerk's website satisfies the
      disclosure obligation, and noted review rights before the Public Access Counselor to the
      extent it counted as a denial.
