    type: filed
    track: cdot
    tracking: S125850-012326
    title: Request to CDOT
    note: >-
      Filed through the Chicago Public Records portal for all records relating to the request to
      install a four-way stop at 55th Street and South Kildare Avenue.
  - id: 2026-01-30-cdot-release
    date: "2026-01-30"
    type: final
    track: cdot
    title: Full release, CDOT
    note: >-
      CDOT released what it held and explained that the all-way stop control originated as an Order
      from Ward 13 to the Committee on Pedestrian and Traffic Safety, that CDOT reviews these but
      keeps limited documentation, and that the remaining materials sit with the Ward and the
      Committee. The response cited Duncan Publishing v. City of Chicago for the position that each
      City department is a separate public body under 5 ILCS 140/2(a), so a request must go to the
      department holding the records.
