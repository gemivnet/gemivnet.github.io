    title: Request submitted to CDOT
    note: >-
      Filed through the Chicago Public Records portal for all documents relating to a CDOT
      engineering observation of West 53rd Street and South Harding Avenue carried out between
      February and December 2023 at the request of the 23rd Ward alderman following a constituent
      complaint — the engineer's report, any recommendations, their status, and any improvement
      plans.
  - id: extension
    date: "2025-06-20"
    type: extension
    title: Five-day extension
    note: >-
      CDOT took an extension under 5 ILCS 140/3(e), checking two grounds: that the records had not
      been located in a routine search and further efforts were being made, and that consultation
      with another public body was needed.
  - id: followup
