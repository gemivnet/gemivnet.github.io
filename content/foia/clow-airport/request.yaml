  - id: filed-faa
    date: "2026-04-19"
    type: filed
    track: faa
    title: Parallel request to the FAA
    note: >-
      Filed under 5 U.S.C. § 552 for records held by the FAA and the Greater Chicago FSDO covering
      JWA at Clow (FAA LID 1C5) from January 1, 2015. PTRS and SAS surveillance records,
      enforcement actions, hotline complaints, accident and incident reports, certificates, and
      correspondence. Fees accepted up to $50.
  - id: ack-faa
    date: "2026-04-22"
    type: acknowledged
    track: faa
    tracking: FAA-2026-03294
    title: Acknowledged and split across two FAA offices
    note: >-
      Assigned to Flight Standards Service and to the Office of Audit and Evaluation as a
      multi-assignment, each issuing its own response.
  - id: fee-faa
    date: "2026-04-28"
    type: fee
    track: faa
    title: FAA requires a perfected request and a $650 fee agreement
    note: >-
      Flight Standards placed the request on hold as improperly formatted under 5 U.S.C. §
      552(a)(3)(A) and 49 C.F.R. § 7.24, estimated $650 in search time beyond the two free hours in
      the "all other" fee category, and asked that the period be cut to 2021 onward with tail
      numbers and FAA personnel named. A response was required by May 1.
  - id: withdrawn-faa
    date: "2026-04-29"
    type: withdrawn
    track: faa
    title: FAA request withdrawn
    note: >-
      Withdrawn in full rather than narrowed under the deadline, with the intention of filing a
      narrower request later. The FAA acknowledged the withdrawal the same morning. No records were
      released and no fee was paid.
