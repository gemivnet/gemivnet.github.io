rights:
  note: >-
    Records released under the Illinois Freedom of Information Act (5 ILCS 140) by the Village of
    Bolingbrook, and correspondence with the Federal Aviation Administration under the federal FOIA
    (5 U.S.C. § 552). Illinois public records carry no copyright claim by the Village; the federal
    material is a work of the US Government and is not subject to copyright (17 U.S.C. § 105).
