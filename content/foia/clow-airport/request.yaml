seo:
  description: >-
    Records on JW Aviation's operations at Bolingbrook's Clow International Airport, from three
    parallel requests to the Village and the FAA.
  keywords:
    - Clow International Airport FOIA
    - JWA Aviation Bolingbrook
    - JW Aviation flight school records
