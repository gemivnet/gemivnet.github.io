<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f14;
    --panel: #111820;
    --panel-hover: #182028;
    --border: #1e2a36;
    --text: #c8d6e0;
    --text-dim: #5a7080;
    --accent: #3b9eff;
    --accent-dim: rgba(59,158,255,0.12);
    --green: #34d399;
    --red: #f87171;
    --orange: #fb923c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  .sidebar {
    width: 320px;
    min-width: 320px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .sidebar-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-header h1 {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .sidebar-header p {
    font-size: 12px;
    color: var(--text-dim);
  }

  .toolbar {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }

  .toolbar button {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    background: var(--panel-hover);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .toolbar button:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  .upload-zone {
    margin: 16px;
    padding: 24px 16px;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .upload-zone input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .upload-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.5; }
  .upload-zone p { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .upload-zone p strong { color: var(--accent); }

  .flight-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .flight-list::-webkit-scrollbar { width: 4px; }
  .flight-list::-webkit-scrollbar-track { background: transparent; }
  .flight-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .flight-card {
    padding: 14px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 4px;
    border: 1px solid transparent;
    position: relative;
  }

  .flight-card:hover { background: var(--panel-hover); }

  .flight-card.active {
    border-color: var(--flight-color, var(--accent));
    background: color-mix(in srgb, var(--flight-color, var(--accent)) 10%, transparent);
  }

  .flight-card .color-pip {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    vertical-align: middle;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .flight-card.active .color-pip { opacity: 1; }

  .flight-card .tail {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 4px;
  }

  .flight-card .route {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .flight-card .meta {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .flight-card .meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .flight-card .points {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .flight-card .name-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--orange);
    background: rgba(251, 146, 60, 0.1);
    padding: 2px 8px;
    border-radius: 4px;
    margin-top: 6px;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.15s;
    line-height: 1;
  }

  .delete-btn:hover {
    color: var(--red);
    background: rgba(248, 113, 113, 0.15);
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.6;
  }

  .map-container { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }

  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(1.1) saturate(0.3); }
  .leaflet-control-zoom a {
    background: var(--panel) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
  }
  .leaflet-control-attribution { display: none; }

  .flight-info {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 1000;
    background: rgba(17, 24, 32, 0.92);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    min-width: 220px;
    max-width: 280px;
    display: none;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }

  .flight-info.visible { display: block; }
  .flight-info::-webkit-scrollbar { width: 3px; }
  .flight-info::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .info-block {
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .info-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .info-block h3 {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: #fff;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .info-block h3 .pip {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .info-block .stat {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 3px 0;
  }

  .info-block .stat .label { color: var(--text-dim); }
  .info-block .stat .value { font-family: 'DM Mono', monospace; color: var(--text); }

  .legend {
    position: absolute;
    bottom: 24px;
    right: 16px;
    z-index: 1000;
    background: rgba(17, 24, 32, 0.92);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    display: none;
  }

  .legend.visible { display: block; }

  .legend .title {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .legend .gradient-bar {
    width: 160px;
    height: 10px;
    border-radius: 3px;
    margin-bottom: 4px;
  }

  .legend .labels {
    display: flex;
    justify-content: space-between;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 3px 0;
  }

  .legend-item .swatch {
    width: 20px;
    height: 4px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .map-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    pointer-events: none;
  }

  .map-empty p {
    font-size: 14px;
    color: var(--text-dim);
    background: rgba(17, 24, 32, 0.8);
    padding: 12px 24px;
    border-radius: 8px;
  }

  .map-empty.hidden { display: none; }

  .airport-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: #fff;
    background: rgba(17, 24, 32, 0.85);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }

  /* ── Pilot stats footer ── */
  .pilot-stats {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    max-height: 200px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .pilot-stats::-webkit-scrollbar { width: 3px; }
  .pilot-stats::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .pilot-stats .section-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .pilot-stat-block {
    margin-bottom: 10px;
  }

  .pilot-stat-block:last-child { margin-bottom: 0; }

  .pilot-stat-block .pilot-name {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--orange);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .pilot-stat-block .pilot-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    padding: 2px 0;
  }

  .pilot-stat-block .pilot-row .label { color: var(--text-dim); }
  .pilot-stat-block .pilot-row .value { font-family: 'DM Mono', monospace; color: var(--text); }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>Flight Viewer</h1>
    <p>Upload FlightAware KML files to view tracks</p>
  </div>

  <div class="toolbar" id="toolbar" style="display:none">
    <button onclick="selectAll()">Select All</button>
    <button onclick="deselectAll()">Deselect All</button>
  </div>

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" multiple accept=".kml">
    <div class="upload-icon">✈</div>
    <p>Drop KML files here or <strong>browse</strong></p>
  </div>

  <div class="flight-list" id="flightList">
    <div class="empty-state">
      No flights loaded yet.<br>
      Upload KML files from FlightAware to get started.
    </div>
  </div>

  <div class="pilot-stats" id="pilotStats" style="display:none"></div>
</div>

<div class="map-container">
  <div id="map"></div>
  <div class="map-empty" id="mapEmpty">
    <p>Select a flight to view its track</p>
  </div>
  <div class="flight-info" id="flightInfo"></div>
  <div class="legend" id="legend"></div>
</div>

<script>
const flights = [];
const activeFlights = new Set();
let mapLayers = [];

const FLIGHT_COLORS = [
  '#3b9eff', '#34d399', '#fb923c', '#f87171', '#a78bfa',
  '#facc15', '#22d3ee', '#f472b6', '#4ade80', '#e879f9',
];

function flightColor(index) {
  return FLIGHT_COLORS[index % FLIGHT_COLORS.length];
}

const map = L.map('map', { center: [41.9, -87.9], zoom: 11, zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

// ── Color helpers ──
function altColorRainbow(alt, minAlt, maxAlt) {
  const range = maxAlt - minAlt || 1;
  const t = Math.max(0, Math.min(1, (alt - minAlt) / range));
  const r = t < 0.5 ? 0 : Math.round(255 * (t - 0.5) * 2);
  const g = t < 0.5 ? Math.round(255 * t * 2) : Math.round(255 * (1 - (t - 0.5) * 2));
  const b = t < 0.5 ? Math.round(255 * (1 - t * 2)) : 0;
  return `rgb(${r},${g},${b})`;
}

function altColorTinted(alt, minAlt, maxAlt, baseColor) {
  const hex = baseColor.replace('#', '');
  const br = parseInt(hex.substring(0, 2), 16);
  const bg = parseInt(hex.substring(2, 4), 16);
  const bb = parseInt(hex.substring(4, 6), 16);
  const range = maxAlt - minAlt || 1;
  const t = Math.max(0, Math.min(1, (alt - minAlt) / range));
  const factor = 0.4 + t * 0.6;
  return `rgb(${Math.round(br * factor)},${Math.round(bg * factor)},${Math.round(bb * factor)})`;
}

function makeGradient(minAlt, maxAlt) {
  const stops = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    stops.push(altColorRainbow(minAlt + t * (maxAlt - minAlt), minAlt, maxAlt));
  }
  return `linear-gradient(to right, ${stops.join(', ')})`;
}

// ── Parse filename ──
function parseFilename(name) {
  const base = name.replace(/\.kml$/i, '');
  const parts = base.split('-');
  let date = '', tail = '', pilot = '', routeParts = [];
  if (parts.length >= 5 && parts[0].length === 4) {
    date = `${parts[0]}-${parts[1]}-${parts[2]}`;
    tail = parts[3];
    pilot = parts[4];
    routeParts = parts.slice(5);
  } else {
    tail = base;
  }
  return { tail, date, pilot, route: routeParts.length > 0 ? routeParts.join(' → ') : '' };
}

// ── Parse KML ──
function parseKML(text) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'text/xml');
  const ns = 'http://www.opengis.net/kml/2.2';
  const gxNs = 'http://www.google.com/kml/ext/2.2';
  const docName = doc.querySelector('Document > n')?.textContent || '';

  const airports = [];
  for (const pm of doc.getElementsByTagNameNS(ns, 'Placemark')) {
    const point = pm.getElementsByTagNameNS(ns, 'Point')[0];
    if (point) {
      const nameEl = pm.querySelector('n');
      const coordsEl = point.getElementsByTagNameNS(ns, 'coordinates')[0];
      if (nameEl && coordsEl) {
        const [lon, lat] = coordsEl.textContent.trim().split(',').map(Number);
        airports.push({ name: nameEl.textContent.trim(), lat, lon });
      }
    }
  }

  const legs = [];
  for (const track of doc.getElementsByTagNameNS(gxNs, 'Track')) {
    const whens = track.getElementsByTagNameNS(ns, 'when');
    const coords = track.getElementsByTagNameNS(gxNs, 'coord');
    let legRoute = '';
    let parent = track.parentElement;
    while (parent && parent.tagName !== 'Placemark') parent = parent.parentElement;
    if (parent) {
      const desc = parent.querySelector('description');
      if (desc) legRoute = desc.textContent.trim();
    }
    const points = [];
    for (let i = 0; i < Math.min(whens.length, coords.length); i++) {
      const ts = whens[i].textContent.trim();
      const [lon, lat, alt] = coords[i].textContent.trim().split(/\s+/).map(Number);
      if (!isNaN(lat) && !isNaN(lon)) points.push({ lat, lon, alt: alt || 0, timestamp: ts });
    }
    if (points.length > 0) legs.push({ route: legRoute, points });
  }

  const seen = new Set();
  const uniqueAirports = airports.filter(a => { if (seen.has(a.name)) return false; seen.add(a.name); return true; });
  return { docName, airports: uniqueAirports, legs };
}

// ── IndexedDB ──
const DB_NAME = 'flightViewerDB';
const DB_VERSION = 2;
const STORE_NAME = 'flights';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'filename' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function cacheFlight(fn, kmlText) { const db = await openDB(); db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put({ filename: fn, kmlText }); }
async function removeCachedFlight(fn) { const db = await openDB(); db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).delete(fn); }
async function loadCachedFlights() {
  const db = await openDB();
  return new Promise((res, rej) => { const r = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}

function addFlight(filename, kmlText) {
  if (flights.some(f => f.filename === filename)) return;
  const { docName, airports, legs } = parseKML(kmlText);
  const info = parseFilename(filename);
  if (!info.tail && docName) { const m = docName.match(/[A-Z]\d{1,5}[A-Z]{0,2}/); if (m) info.tail = m[0]; }
  const allPoints = legs.flatMap(l => l.points).sort((a, b) => {
    if (!a.timestamp || !b.timestamp) return 0;
    return new Date(a.timestamp) - new Date(b.timestamp);
  });
  flights.push({ filename, info, legs, airports, allPoints });
}

function handleFiles(fileList) {
  Array.from(fileList).forEach(file => {
    if (!file.name.toLowerCase().endsWith('.kml') || flights.some(f => f.filename === file.name)) return;
    const reader = new FileReader();
    reader.onload = async (e) => { addFlight(file.name, e.target.result); await cacheFlight(file.name, e.target.result); renderFlightList(); };
    reader.readAsText(file);
  });
}

async function deleteFlight(index, event) {
  event.stopPropagation();
  await removeCachedFlight(flights[index].filename);
  const newActive = new Set();
  for (const idx of activeFlights) { if (idx === index) continue; newActive.add(idx > index ? idx - 1 : idx); }
  activeFlights.clear();
  for (const idx of newActive) activeFlights.add(idx);
  flights.splice(index, 1);
  renderFlightList();
  renderMap();
}

(async () => {
  try {
    const cached = await loadCachedFlights();
    cached.forEach(({ filename, kmlText }) => addFlight(filename, kmlText));
    renderFlightList();
    if (flights.length > 0) document.getElementById('mapEmpty').querySelector('p').textContent = `${flights.length} flight${flights.length > 1 ? 's' : ''} loaded. Click to toggle`;
  } catch (e) { console.warn('Could not load cached flights:', e); }
})();

function computeDuration(flight) {
  const pts = flight.allPoints;
  const timestamps = pts.map(p => p.timestamp).filter(Boolean).map(t => new Date(t).getTime()).filter(t => !isNaN(t));
  if (timestamps.length < 2) return '-';
  const mins = Math.round((Math.max(...timestamps) - Math.min(...timestamps)) / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

// ── Selection ──
function toggleFlight(index) {
  if (activeFlights.has(index)) activeFlights.delete(index); else activeFlights.add(index);
  renderFlightList();
  renderMap();
}

function selectAll() { flights.forEach((_, i) => activeFlights.add(i)); renderFlightList(); renderMap(); }
function deselectAll() { activeFlights.clear(); renderFlightList(); renderMap(); }

// ── Sidebar ──
function renderFlightList() {
  const list = document.getElementById('flightList');
  document.getElementById('toolbar').style.display = flights.length > 1 ? 'flex' : 'none';

  if (flights.length === 0) {
    list.innerHTML = '<div class="empty-state">No flights loaded yet.<br>Upload KML files to get started.</div>';
    return;
  }

  list.innerHTML = flights.map((f, i) => {
    const legRoutes = f.legs.map(l => l.route).filter(Boolean);
    const routeDisplay = f.info.route || legRoutes.join(', ') || '-';
    const color = flightColor(i);
    const isActive = activeFlights.has(i);
    return `
    <div class="flight-card ${isActive ? 'active' : ''}" style="--flight-color: ${color}" onclick="toggleFlight(${i})">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div class="tail"><span class="color-pip" style="background:${color}"></span>${f.info.tail || 'Unknown'}</div>
        <button class="delete-btn" onclick="deleteFlight(${i}, event)" title="Remove flight">✕</button>
      </div>
      ${routeDisplay !== '-' ? `<div class="route">${routeDisplay}</div>` : ''}
      <div class="meta">
        <span>📅 ${f.info.date || '-'}</span>
        <span>🕐 ${computeDuration(f)}</span>
        ${f.legs.length > 1 ? `<span>🦵 ${f.legs.length} legs</span>` : ''}
      </div>
      <div class="points">${f.allPoints.length.toLocaleString()} points</div>
      ${f.info.pilot ? `<div class="name-tag">${f.info.pilot}</div>` : ''}
    </div>`;
  }).join('');

  renderPilotStats();
}

// ── Pilot stats (all uploaded flights, not just active) ──
function renderPilotStats() {
  const panel = document.getElementById('pilotStats');

  if (flights.length === 0) { panel.style.display = 'none'; return; }

  // Group by pilot
  const byPilot = {};
  for (const f of flights) {
    const pilot = f.info.pilot || 'unknown';
    if (!byPilot[pilot]) byPilot[pilot] = [];
    byPilot[pilot].push(f);
  }

  let html = '<div class="section-title">Pilot Totals</div>';

  for (const [pilot, pFlights] of Object.entries(byPilot).sort((a, b) => b[1].length - a[1].length)) {
    // Total duration in minutes
    let totalMins = 0;
    let totalPoints = 0;
    let totalLegs = 0;
    let maxAltFt = 0;
    const tails = new Set();
    const airports = new Set();

    for (const f of pFlights) {
      const timestamps = f.allPoints.map(p => p.timestamp).filter(Boolean).map(t => new Date(t).getTime()).filter(t => !isNaN(t));
      if (timestamps.length >= 2) {
        totalMins += (Math.max(...timestamps) - Math.min(...timestamps)) / 60000;
      }
      totalPoints += f.allPoints.length;
      totalLegs += f.legs.length;
      tails.add(f.info.tail);
      for (const a of f.airports) airports.add(a.name);
      const alts = f.allPoints.map(p => p.alt);
      const fMaxFt = Math.round(Math.max(...alts) * 3.28084);
      if (fMaxFt > maxAltFt) maxAltFt = fMaxFt;
    }

    totalMins = Math.round(totalMins);
    const h = Math.floor(totalMins / 60), m = totalMins % 60;
    const durStr = h > 0 ? `${h}h ${m}m` : `${m}m`;

    html += `
      <div class="pilot-stat-block">
        <div class="pilot-name">${pilot}</div>
        <div class="pilot-row"><span class="label">Flights</span><span class="value">${pFlights.length}</span></div>
        <div class="pilot-row"><span class="label">Total Time</span><span class="value">${durStr}</span></div>
        <div class="pilot-row"><span class="label">Legs</span><span class="value">${totalLegs}</span></div>
        <div class="pilot-row"><span class="label">Max Alt</span><span class="value">${maxAltFt.toLocaleString()} ft</span></div>
        <div class="pilot-row"><span class="label">Aircraft</span><span class="value">${[...tails].join(', ')}</span></div>
        <div class="pilot-row"><span class="label">Airports</span><span class="value">${[...airports].join(', ')}</span></div>
      </div>`;
  }

  panel.innerHTML = html;
  panel.style.display = 'block';
}

// ── Map rendering ──
function renderMap() {
  mapLayers.forEach(l => map.removeLayer(l));
  mapLayers = [];

  const infoPanel = document.getElementById('flightInfo');
  const legendPanel = document.getElementById('legend');

  if (activeFlights.size === 0) {
    document.getElementById('mapEmpty').classList.remove('hidden');
    infoPanel.classList.remove('visible');
    legendPanel.classList.remove('visible');
    return;
  }

  document.getElementById('mapEmpty').classList.add('hidden');

  const isSingle = activeFlights.size === 1;
  const allLats = [], allLons = [];
  const drawnAirports = new Set();

  // Global alt range for single-flight rainbow
  let gMinAlt = Infinity, gMaxAlt = -Infinity;
  if (isSingle) {
    const pts = flights[[...activeFlights][0]].allPoints;
    for (const p of pts) { if (p.alt < gMinAlt) gMinAlt = p.alt; if (p.alt > gMaxAlt) gMaxAlt = p.alt; }
  }

  for (const idx of activeFlights) {
    const flight = flights[idx];
    const pts = flight.allPoints;
    const color = flightColor(idx);
    if (pts.length === 0) continue;

    const alts = pts.map(p => p.alt);
    const minAlt = Math.min(...alts), maxAlt = Math.max(...alts);

    // Track lines
    for (const leg of flight.legs) {
      const lp = leg.points;
      for (let i = 0; i < lp.length - 1; i++) {
        const a = lp[i], b = lp[i + 1];
        const segColor = isSingle ? altColorRainbow(a.alt, gMinAlt, gMaxAlt) : altColorTinted(a.alt, minAlt, maxAlt, color);
        const line = L.polyline([[a.lat, a.lon], [b.lat, b.lon]], { color: segColor, weight: 3, opacity: 0.85 }).addTo(map);
        mapLayers.push(line);
      }
    }

    // Start / end markers
    const sp = pts[0], ep = pts[pts.length - 1];
    const sm = L.circleMarker([sp.lat, sp.lon], {
      radius: isSingle ? 8 : 6, fillColor: isSingle ? '#34d399' : color, fillOpacity: 1, color: '#000', weight: 2,
    }).addTo(map).bindTooltip(isSingle ? 'Start' : `${flight.info.tail} start`, { permanent: false });
    mapLayers.push(sm);

    const em = L.circleMarker([ep.lat, ep.lon], {
      radius: isSingle ? 8 : 6, fillColor: isSingle ? '#f87171' : color, fillOpacity: isSingle ? 1 : 0.6, color: '#000', weight: 2,
    }).addTo(map).bindTooltip(isSingle ? 'End' : `${flight.info.tail} end`, { permanent: false });
    mapLayers.push(em);

    // Airports
    for (const apt of flight.airports) {
      if (drawnAirports.has(apt.name)) continue;
      drawnAirports.add(apt.name);
      const icon = L.divIcon({ className: '', html: `<div class="airport-label">${apt.name}</div>`, iconSize: null, iconAnchor: [0, -12] });
      mapLayers.push(L.marker([apt.lat, apt.lon], { icon, interactive: false }).addTo(map));
      mapLayers.push(L.circleMarker([apt.lat, apt.lon], { radius: 4, fillColor: '#fff', fillOpacity: 0.7, color: '#1e2a36', weight: 1 }).addTo(map));
    }

    for (const p of pts) { allLats.push(p.lat); allLons.push(p.lon); }
  }

  // Fit bounds
  if (allLats.length > 0) {
    map.fitBounds([
      [Math.min(...allLats) - 0.01, Math.min(...allLons) - 0.01],
      [Math.max(...allLats) + 0.01, Math.max(...allLons) + 0.01],
    ]);
  }

  // Info panel
  let infoHTML = '';
  for (const idx of activeFlights) {
    const f = flights[idx];
    const color = flightColor(idx);
    const maxFt = Math.round(Math.max(...f.allPoints.map(p => p.alt)) * 3.28084);
    const legRoutes = f.legs.map(l => l.route).filter(Boolean);
    const routeStr = f.info.route || legRoutes.join(' + ') || '-';
    infoHTML += `
      <div class="info-block">
        <h3><span class="pip" style="background:${color}"></span>${f.info.tail || 'Unknown'}</h3>
        <div class="stat"><span class="label">Route</span><span class="value">${routeStr}</span></div>
        <div class="stat"><span class="label">Date</span><span class="value">${f.info.date || '-'}</span></div>
        <div class="stat"><span class="label">Duration</span><span class="value">${computeDuration(f)}</span></div>
        <div class="stat"><span class="label">Max Alt</span><span class="value">${maxFt.toLocaleString()} ft</span></div>
        <div class="stat"><span class="label">Legs</span><span class="value">${f.legs.length}</span></div>
        <div class="stat"><span class="label">Points</span><span class="value">${f.allPoints.length.toLocaleString()}</span></div>
        ${f.info.pilot ? `<div class="stat"><span class="label">Pilot</span><span class="value">${f.info.pilot}</span></div>` : ''}
      </div>`;
  }
  infoPanel.innerHTML = infoHTML;
  infoPanel.classList.add('visible');

  // Legend
  if (isSingle) {
    const minFt = Math.round(gMinAlt * 3.28084), maxFt = Math.round(gMaxAlt * 3.28084);
    legendPanel.innerHTML = `
      <div class="title">Altitude (ft)</div>
      <div class="gradient-bar" style="background: ${makeGradient(gMinAlt, gMaxAlt)}"></div>
      <div class="labels"><span>${minFt.toLocaleString()}</span><span>${maxFt.toLocaleString()}</span></div>`;
  } else {
    let html = '<div class="title">Flights</div>';
    for (const idx of activeFlights) {
      html += `<div class="legend-item"><span class="swatch" style="background:${flightColor(idx)}"></span>${flights[idx].info.tail || 'Unknown'}</div>`;
    }
    legendPanel.innerHTML = html;
  }
  legendPanel.classList.add('visible');
}

// ── Events ──
document.getElementById('fileInput').addEventListener('change', (e) => handleFiles(e.target.files));

const uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', (e) => { e.preventDefault(); uploadZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
</script>
</body>
