<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>First Flight, George & Shelby · KUES · Jan 31 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0c10;
    color: #e0e4ec;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    touch-action: none;
  }

  #canvas-container {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  canvas { display: block; }

  /* ─── HEADER ─── */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 28px 36px 20px;
    background: linear-gradient(to bottom, rgba(10,12,16,0.92) 0%, rgba(10,12,16,0.6) 60%, transparent 100%);
    pointer-events: none;
  }

  .header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7a8599;
    margin-bottom: 6px;
  }

  .header h2 {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 300;
    color: #f0f2f7;
    letter-spacing: -0.3px;
  }

  .header h2 span { font-weight: 700; }

  .header .date {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: #4a5568;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* ─── TELEMETRY HUDs ─── */
  .telemetry {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    pointer-events: none;
  }

  .telemetry.left { left: 28px; }
  .telemetry.right { right: 28px; }

  .hud-card {
    background: rgba(10,12,16,0.82);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 16px 20px 14px;
    backdrop-filter: blur(14px);
    min-width: 155px;
  }

  .hud-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .hud-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .hud-tail {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
  }

  .hud-crew {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #4a5568;
    font-weight: 400;
    letter-spacing: 0;
  }

  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 6px;
  }

  .hud-row:last-child { margin-bottom: 0; }

  .hud-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #4a5568;
    white-space: nowrap;
  }

  .hud-value {
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #e0e4ec;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .hud-unit {
    font-size: 11px;
    font-weight: 400;
    color: #5a6578;
    margin-left: 2px;
  }

  .hud-inactive .hud-value { color: #2a3040; }

  /* ─── CONTROLS HINT ─── */
  .controls-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    text-align: center;
    pointer-events: none;
    opacity: 1;
    transition: opacity 1.2s ease;
  }

  .controls-hint.hidden { opacity: 0; }

  .controls-hint p {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: #4a5568;
    letter-spacing: 1px;
  }

  /* ─── PLAYBACK ─── */
  .playback {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    pointer-events: auto;
    background: rgba(10,12,16,0.85);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 10px 20px;
    backdrop-filter: blur(12px);
  }

  .play-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.15);
    color: #e0e4ec;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.2s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .play-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
  }

  .play-btn:active {
    background: rgba(255,255,255,0.15);
  }

  .timeline {
    width: 280px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    /* bigger touch target */
    padding: 10px 0;
    margin: -10px 0;
  }

  .timeline-inner {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    position: relative;
  }

  .timeline-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #4ac8ff, #ff6b4a);
    width: 0%;
    transition: width 0.05s linear;
  }

  .timeline-time {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: #7a8599;
    min-width: 50px;
  }

  /* ─── LEGEND ─── */
  .legend {
    position: absolute;
    bottom: 84px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 28px;
    pointer-events: none;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .legend-swatch {
    width: 20px;
    height: 3px;
    border-radius: 2px;
  }

  .legend-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
  }

  /* ─── MOBILE ─── */
  @media (max-width: 600px) {
    .header {
      padding: 18px 18px 12px;
    }
    .header h1 {
      font-size: 10px;
      letter-spacing: 2px;
    }
    .header h2 {
      font-size: 20px;
    }
    .header .date {
      font-size: 9px;
    }

    /* Stack HUDs horizontally at top-right as compact pills */
    .telemetry.left,
    .telemetry.right {
      position: absolute;
      top: auto;
      bottom: auto;
      left: auto;
      right: auto;
      transform: none;
    }

    .telemetry.left {
      top: 95px;
      left: 18px;
    }
    .telemetry.right {
      top: 95px;
      left: calc(50% + 4px);
    }

    .hud-card {
      min-width: 0;
      width: calc((100vw - 44px) / 2);
      padding: 10px 12px 8px;
      border-radius: 8px;
    }

    .hud-header {
      margin-bottom: 8px;
      padding-bottom: 6px;
      gap: 6px;
    }

    .hud-dot { width: 6px; height: 6px; }

    .hud-tail {
      font-size: 10px;
      letter-spacing: 1px;
    }

    .hud-crew {
      font-size: 9px;
    }

    .hud-row {
      margin-bottom: 4px;
      gap: 8px;
    }

    .hud-label {
      font-size: 8px;
      letter-spacing: 1px;
    }

    .hud-value {
      font-size: 16px;
    }

    .hud-unit {
      font-size: 9px;
    }

    /* Playback: full width, bigger touch targets */
    .playback {
      bottom: 24px;
      left: 12px;
      right: 12px;
      transform: none;
      width: calc(100% - 24px);
      padding: 10px 14px;
      gap: 10px;
    }

    .play-btn {
      width: 36px;
      height: 36px;
      font-size: 14px;
      flex-shrink: 0;
    }

    .timeline {
      flex: 1;
      width: auto;
      min-width: 0;
    }

    .timeline-time {
      font-size: 9px;
      min-width: 42px;
      text-align: right;
    }

    /* Legend: stack vertically or shrink */
    .legend {
      bottom: 82px;
      gap: 14px;
    }

    .legend-label {
      font-size: 8px;
      letter-spacing: 0.5px;
    }

    .legend-swatch {
      width: 14px;
    }

    .controls-hint p {
      font-size: 9px;
      letter-spacing: 0.5px;
    }
  }

  /* Very small screens */
  @media (max-width: 360px) {
    .legend {
      flex-direction: column;
      align-items: center;
      gap: 6px;
      bottom: 78px;
    }
  }
</style>

const CENTER_LAT = 43.133, CENTER_LON = -88.40, SCALE_H = 400, SCALE_V = 0.012, GROUND_ALT = 600;

function geoToScene(lat, lon, alt) {
  return new THREE.Vector3(
    (lon - CENTER_LON) * Math.cos(CENTER_LAT * Math.PI / 180) * SCALE_H,
    (alt - GROUND_ALT) * SCALE_V,
    -(lat - CENTER_LAT) * SCALE_H

}

// ─── Mouse events ───
c.addEventListener('pointerdown', e => {
  if (e.pointerId !== undefined) {
    // ignore if it's a second pointer (pinch handled below)
    if (window._activePointers && window._activePointers.size >= 1) return;
    if (!window._activePointers) window._activePointers = new Map();
    window._activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }
  ctrl.drag = true;
  ctrl.last = { x: e.clientX, y: e.clientY };
  ctrl.autoRot = false;
  dismissHint();
});

c.addEventListener('pointermove', e => {
  if (window._activePointers) window._activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  // If two pointers active, skip orbit (pinch handles zoom)
  if (window._activePointers && window._activePointers.size >= 2) return;
  if (!ctrl.drag) return;
  ctrl.sph.theta -= (e.clientX - ctrl.last.x) * 0.005;
  ctrl.sph.phi += (e.clientY - ctrl.last.y) * 0.005;
  ctrl.last = { x: e.clientX, y: e.clientY };
});

c.addEventListener('pointerup', e => {
  ctrl.drag = false;
  if (window._activePointers) window._activePointers.delete(e.pointerId);
});

c.addEventListener('pointercancel', e => {
  ctrl.drag = false;
  if (window._activePointers) window._activePointers.delete(e.pointerId);
});

// ─── Mouse wheel zoom ───

  ctrl.sph.r += e.deltaY * 0.04;

}, { passive: false });

  if (e.touches.length === 2) {
    _lastPinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    ctrl.drag = false; // disable orbit during pinch
  }
  dismissHint();
}, { passive: true });

c.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    ctrl.sph.r += (_lastPinchDist - d) * 0.12;
    _lastPinchDist = d;
    ctrl.autoRot = false;
    e.preventDefault();
    return;
  }
  e.preventDefault();
}, { passive: false });

function buildPath(data, color, glowColor) {
  const pts = [], gpts = [];
  for (let i = 0; i < data.lat.length; i++) {
    const p = geoToScene(data.lat[i], data.lon[i], data.alt[i]);
    pts.push(p); gpts.push(new THREE.Vector3(p.x, 0.01, p.z));
  }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.3);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length * 3, 0.15, 8, false), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 }));
  const glow = new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length * 3, 0.4, 8, false), new THREE.MeshBasicMaterial({ color: glowColor, transparent: true, opacity: 0.12 }));
  const shCurve = new THREE.CatmullRomCurve3(gpts, false, 'catmullrom', 0.3);
  const shadow = new THREE.Mesh(new THREE.TubeGeometry(shCurve, gpts.length * 2, 0.1, 4, false), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.08 }));
  const drops = new THREE.Group();
  const step = Math.max(1, Math.floor(data.lat.length / 20));
  for (let i = 0; i < data.lat.length; i += step) {
    const p = pts[i];
    drops.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(p.x, p.y, p.z), new THREE.Vector3(p.x, 0, p.z)]), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.06 })));
  }
  const mkr = new THREE.SphereGeometry(0.25, 16, 16), mm = new THREE.MeshBasicMaterial({ color });
  const sm = new THREE.Mesh(mkr, mm); sm.position.copy(pts[0]);
  const em = new THREE.Mesh(mkr.clone(), mm.clone()); em.position.copy(pts[pts.length - 1]);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff })); head.visible = false;
  const hg = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 16), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3 })); hg.visible = false;
  scene.add(tube, glow, shadow, drops, sm, em, head, hg);
  return { tube, glow, shadow, head, headGlow: hg, points3D: pts };
}

// Timeline scrub. Works for both mouse and touch
function scrubAt(clientX) {
  const inner = tl.querySelector('.timeline-inner');
  const r = inner.getBoundingClientRect();
  prog = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  tick(prog);
}

function posAt(path, times, t) {
  if (t <= times[0]) return null;
  if (t >= times[times.length-1]) return path.points3D[path.points3D.length-1].clone();
  for (let i = 0; i < times.length-1; i++) if (t >= times[i] && t <= times[i+1]) { const f = (t-times[i])/(times[i+1]-times[i]); return new THREE.Vector3().lerpVectors(path.points3D[i], path.points3D[i+1], f); }
  return null;
}

function dataAt(raw, times, t) {
  if (t < times[0]) return null;
  if (t >= times[times.length-1]) return { alt: raw.alt[raw.alt.length-1], speed: raw.speed[raw.speed.length-1] };
  for (let i = 0; i < times.length-1; i++) if (t >= times[i] && t <= times[i+1]) { const f = (t-times[i])/(times[i+1]-times[i]); return { alt: Math.round(raw.alt[i]+(raw.alt[i+1]-raw.alt[i])*f), speed: Math.round(raw.speed[i]+(raw.speed[i+1]-raw.speed[i])*f) }; }
  return null;
}

function vis(path, times, t) {
  if (t <= times[0]) return 0; if (t >= times[times.length-1]) return 1;
  for (let i = 0; i < times.length-1; i++) if (t >= times[i] && t <= times[i+1]) return (i+(t-times[i])/(times[i+1]-times[i]))/(times.length-1);
  return 1;
}

function fmt(v) { return v >= 1000 ? v.toLocaleString() : String(v); }

function hud(aEl, sEl, d) {

  else { aEl.innerHTML = '-<span class="hud-unit">ft</span>'; sEl.innerHTML = '-<span class="hud-unit">kts</span>'; aEl.parentElement.classList.add('hud-inactive'); sEl.parentElement.classList.add('hud-inactive'); }
}

function tick(p) {
  const t = tStart + p * tDur;
  const ts = Math.floor(t), h = Math.floor(ts/3600), m = Math.floor((ts%3600)/60), s = ts%60;
  tLbl.textContent = h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+' PM';

  [pathShelby, pathGeorge].forEach(path => {

  const sv = vis(pathShelby, sT, t), gv = vis(pathGeorge, gT, t);

  pathGeorge.shadow.geometry.setDrawRange(0, Math.floor(gv * pathGeorge.shadow.geometry.index.count));

  hud(hA236, hS236, dataAt(n236va, sT, t));
  hud(hA242, hS242, dataAt(n242va, gT, t));
}

function showFull() {
  [pathShelby, pathGeorge].forEach(p => { p.tube.geometry.setDrawRange(0,Infinity); p.glow.geometry.setDrawRange(0,Infinity); p.shadow.geometry.setDrawRange(0,Infinity); p.head.visible = p.headGlow.visible = false; });
  setMaxLabels();
  hA236.innerHTML = '4,950<span class="hud-unit">ft</span>'; hS236.innerHTML = '110<span class="hud-unit">kts</span>';
  hA242.innerHTML = '5,000<span class="hud-unit">ft</span>'; hS242.innerHTML = '115<span class="hud-unit">kts</span>';
}
showFull();

// ============================================================
// RENDER LOOP
// ============================================================
let t = 0;
(function anim() {
  requestAnimationFrame(anim);
  t += 0.016;
  if (ctrl.autoRot) ctrl.sph.theta += 0.0006;
  ctrl.update();
  const ps = 1 + Math.sin(t*2)*0.3; pr.scale.set(ps,ps,1); prMat.opacity = 0.4-Math.sin(t*2)*0.2;
  const pp = particles.geometry.attributes.position.array;
  for (let i = 0; i < PC; i++) { pp[i*3+1] += pSpd[i]; if (pp[i*3+1]>55) pp[i*3+1]=0; }
  particles.geometry.attributes.position.needsUpdate = true;
  if (playing) { prog += speed*0.016; if (prog>=1) { prog=1; playing=false; playBtn.innerHTML='&#9654;'; setTimeout(showFull,500); } tick(prog); }
  renderer.render(scene, camera);
})();

addEventListener('resize', () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
setTimeout(dismissHint, 4000);
</script>
