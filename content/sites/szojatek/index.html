    <title>Szójáték, Hungarian vocabulary games</title>
    <!-- Installable, which is the point: an installed site is not swept up by iOS Safari's

         classmate to lose months of progress without ever being told. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <style>
      /*
       * Something to look at while the app arrives.
       *
       * The page was blank white for the whole download -- and the download is the app plus a
       * corpus of two thousand words, over a phone connection, on a site people open for four
       * minutes at a time. The shell is removed the moment Svelte mounts.
       */
      .boot {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.6rem;
        font-family:
          ui-rounded, 'SF Pro Rounded', 'Segoe UI Variable Display', 'Segoe UI', system-ui,
          -apple-system, Roboto, sans-serif;
        color: #2c2a26;
        background: #fdfaf4;
      }
      .boot h1 {
        margin: 0;
        font-size: 2.1rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .boot p {
        margin: 0;
        color: #6d675d;
        font-size: 0.95rem;
      }
    </style>
    <script type="module" crossorigin src="/sites/szojatek/assets/index-Bc6XU4qG.js"></script>

  </head>

    <div id="app">
      <div class="boot">

      </div>
    </div>
    <noscript>
      <p style="font-family: system-ui; padding: 2rem; text-align: center">
